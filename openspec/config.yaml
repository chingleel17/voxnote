schema: spec-driven

context: |
  Project: VoxNote
  Description: 桌面應用，功能涵蓋錄音、載入錄音、生成逐字稿、AI 校稿、會議摘要生成。
  未來規劃：全本地端運行、系統聲音/麥克風擷取、即時字幕生成、翻譯字幕、自動校準字幕。

  Tech stack:
  - Frontend: TypeScript + Vite（無框架，Vanilla TS）
  - Desktop: Tauri 2.0
  - Backend: Rust（tokio async, reqwest, serde）
  - Database: SQLite（透過 Rust 層存取）
  - AI: Ollama（本地端 LLM）、AssemblyAI（雲端語音轉文字，未來可替換）

  Conventions:
  - 使用繁體中文（台灣用語）撰寫所有文件與註解
  - 變數/函式命名使用英文 camelCase（TS）或 snake_case（Rust）
  - Tauri 命令名稱使用 snake_case，對應前端 invoke() 呼叫
  - 前端透過 @tauri-apps/api invoke() 呼叫 Rust 命令
  - 使用 Conventional Commits（中文描述）

  Repository structure:
  - src/           TypeScript 前端入口與 UI 模組
  - src-tauri/src/ Rust 後端命令層
  - openspec/      OpenSpec 規範與 artifacts

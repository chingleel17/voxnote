[project]
name = "voxnote-local-asr"
version = "0.1.0"
description = "VoxNote 本地 Breeze-ASR-26 + WhisperX 語音轉錄服務"
requires-python = ">=3.11,<3.13"

# 注意：下限為 3.11、上限 <3.13，原因：
# - onnxruntime（pyannote 間接相依）僅提供 cp311/cp312 wheel，不支援 3.10
# - WhisperX / CTranslate2 / pyannote 對 Python 3.13 支援尚不完整
# 請以 uv 建立隔離環境，勿安裝至全域 Python：
#   cd server
#   uv sync
#   uv run uvicorn app:app --host 0.0.0.0 --port 8000
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "opencc-python-reimplemented>=0.1.7",
    # 音訊前處理需直接操作解碼後的 PCM 陣列，故明確宣告（whisperx 亦間接相依）
    "numpy>=1.26",
    "whisperx>=3.1",
    "ctranslate2>=4.4",
    "torch>=2.2",
    "torchaudio>=2.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[tool.uv]
# torch CUDA 版建議依官方索引安裝，詳見 README 的安裝說明
package = false

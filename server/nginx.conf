# VoxNote ASR gateway
#
# 以單一對外埠同時服務兩個 ASR 實例（同一套 app.py，僅 ASR_MODEL 不同）：
#   /batch/... -> asr-batch（Breeze-ASR-26，中文會議逐字稿）
#   /live/...  -> asr-live （英文模型，即時字幕）
#
# 兩者為獨立 process，各有各的序列化鎖，故長會議轉錄不會讓即時字幕排隊等待
# （GPU 算力仍會爭用，此為物理限制）。

events {
    worker_connections 1024;
}

http {
    # 音訊上傳可達數百 MB（長會議錄音），預設 1m 會被擋下。
    client_max_body_size 2048m;
    # 大檔上傳改為串流轉發，避免 nginx 先落地整份暫存檔再轉送。
    proxy_request_buffering off;

    # 逐字稿回應可達數百 KB，放寬緩衝避免落磁碟。
    proxy_buffers 16 64k;
    proxy_buffer_size 64k;

    upstream asr_batch {
        server asr-batch:8000;
    }

    upstream asr_live {
        server asr-live:8000;
    }

    server {
        listen 8000;

        # 批次逐字稿：長會議可跑數十分鐘，逾時需大於最長預期處理時間。
        # 此值須與客戶端的 LOCAL_ASR_TIMEOUT_SECS（3600 秒）一致，
        # 否則會在 gateway 這層先被切斷，客戶端只看到連線中斷而非真正原因。
        location /batch/ {
            proxy_pass http://asr_batch/;
            proxy_http_version 1.1;

            proxy_connect_timeout 10s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 即時字幕：以數秒音訊視窗呼叫，逾時遠短於批次。
        # 設為 120s 而非數秒，是因為首次請求需惰性載入模型（可達數十秒）；
        # 客戶端自身的秒級逾時（見 add-live-caption-remote-asr）才是即時節奏的
        # 實際把關者，此處僅作為兜底，避免連線無限懸掛。
        location /live/ {
            proxy_pass http://asr_live/;
            proxy_http_version 1.1;

            proxy_connect_timeout 5s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # gateway 自身的健康檢查，不轉發至後端；用於確認 gateway 已就緒。
        # 後端各自的健康檢查為 /batch/health 與 /live/health。
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"voxnote-asr-gateway"}';
        }
    }
}
